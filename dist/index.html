<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround - الصورة المعدلة</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; background: #0b7a2f; color: #fff; }
  header { padding: 24px 16px; text-align: center; }
  header h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 0; opacity: 0.9; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
  .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.6); border-radius: 16px; padding: 16px; }
  .card img { display: block; width: 100%; max-width: 420px; margin: 0 auto; border-radius: 12px; background: #fff; }
  .meta { margin-top: 12px; font-size: 14px; line-height: 1.8; text-align: center; }
  footer { text-align: center; padding: 16px; font-size: 13px; opacity: 0.85; }
</style>
</head>
<body>
<header>
  <h1>تم حذف الكتابة من المستطيل الرابع</h1>
  <p>المستطيل الرابع (إلى حساب) أصبح فارغاً — الصورة النهائية بالأسفل</p>
</header>
<main>
  <div class="card">
    <img src="./edited_no_app_text.png" alt="الصورة بعد حذف النص من المستطيل الرابع" />
    <div class="meta">
      <div>PlayGround static preview</div>
      <div>المصدر داخل المشروع — dist/edited_no_app_text.png</div>
    </div>
  </div>
</main>
<footer>بنك الخرطوم/ابنك حساب 2024© — نسخة عرض فقط</footer>
</body>
</html>
